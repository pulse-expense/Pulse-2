let sb=null, session=null, profile=null, state={expenses:[],categories:[],payments:[],payers:[],budgets:[],recurring:[]};
let editingId=null;


const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>"₹"+Number(v||0).toLocaleString("en-IN",{maximumFractionDigits:2});

function toast(m){$("toast").textContent=m;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2200)}
function getStoredConfig(){try{return JSON.parse(localStorage.getItem(LEGACY_CONFIG_KEY)||"null")}catch{return null}}

function fmtMonth(m){return new Date(m+"-02").toLocaleDateString("en-IN",{month:"long",year:"numeric"})}

function authScreen(message=""){
 document.body.innerHTML=`<div class="auth"><div class="hero">
 <div class="logo">✦</div><h2>Pulse</h2><p>Your money, your rules. Private by design.</p>
 <div class="note">Your expenses are protected by Supabase Auth + PostgreSQL Row Level Security. Each account sees only its own data.</div>
 <button id="googleBtn" class="googleBtn" type="button">
  <svg class="googleIcon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.23c0-.79-.07-1.55-.23-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.91-4.21 2.91-7.42Z"/><path fill="#34A853" d="M12 21.7c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.7Z"/><path fill="#FBBC05" d="M6.54 13.79A5.85 5.85 0 0 1 6.23 12c0-.62.11-1.23.31-1.79V7.68H3.3A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.32l3.24-2.53Z"/><path fill="#EA4335" d="M12 6.18c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.84 3.18 14.63 2.3 12 2.3a9.74 9.74 0 0 0-8.7 5.38l3.24 2.53C7.31 7.9 9.46 6.18 12 6.18Z"/></svg>
  Continue with Google
 </button>
 <div class="oauthDivider"><span>or</span></div>
 <div class="form">
  <div class="field full"><label>Email</label><input id="authEmail" type="email" autocomplete="email"></div>
  <div class="field full"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password"></div>
 </div>
 <div class="modalFoot"><button id="loginBtn" class="btn primary">Sign in</button><button id="signupBtn" class="btn">Create account</button></div>
 <button id="forgotBtn" class="linkBtn" type="button">Forgot password?</button>
 <div id="authMsg" style="color:#94a3b8;margin-top:12px">${esc(message)}</div>
 </div></div>`;
 $("googleBtn").onclick=signInWithGoogle;
 $("loginBtn").onclick=login; $("signupBtn").onclick=signup; $("forgotBtn").onclick=forgotPassword;
}

async function signInWithGoogle(){
 const btn=$("googleBtn");
 if(btn){btn.disabled=true;btn.textContent="Connecting to Google…";}
 const redirectTo=location.origin+location.pathname;
 const r=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo}});
 if(r.error){
  if(btn){btn.disabled=false;btn.innerHTML='<span class="googleIcon" style="display:inline-flex;align-items:center">G</span> Continue with Google';}
  $("authMsg").textContent=r.error.message;
 }
}

function configScreen(){
 document.body.innerHTML=`<div class="auth"><div class="hero">
 <div class="logo">✦</div><h2>Pulse setup</h2><p>One-time deployment configuration.</p>
 <div class="note">For the commercial build, put your <b>sb_publishable_...</b> key in <code>config.js</code>. Never put a secret/service-role key here.</div>
 <div class="form"><div class="field full"><label>Supabase Project URL</label><input id="setupUrl" placeholder="https://your-project.supabase.co"></div><div class="field full"><label>Publishable key</label><input id="setupKey" placeholder="sb_publishable_..."></div></div>
 <div class="modalFoot"><button id="saveSetup" class="btn primary">Connect Pulse</button></div>
 </div></div>`;
 $("saveSetup").onclick=async()=>{const url=$("setupUrl").value.trim().replace(/\/+$/,""),key=$("setupKey").value.trim();if(!/^https:\/\/[a-z0-9-]+\\.supabase\\.co(m)?$/i.test(url)||!key.startsWith("sb_publishable_")){alert("Enter a valid Supabase URL and sb_publishable_ key.");return}localStorage.setItem(LEGACY_CONFIG_KEY,JSON.stringify({url,key}));location.reload()};
}

async function initClient(){
 const c=getConfig();
 if(!c.url||!c.key){configScreen();return false}
 if(!window.supabase){alert("Supabase library failed to load. Check your internet connection.");return false}
 sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data,error}=await sb.auth.getSession();
 if(error){authScreen(error.message);return false}
 session=data.session;
 sb.auth.onAuthStateChange((_e,s)=>{session=s; if(s) loadAll();});
 if(!session){authScreen();return false}
 await loadAll();return true;
}

async function login(){
 const e=$("authEmail").value.trim(),p=$("authPassword").value;
 if(!e||!p){$("authMsg").textContent="Enter email and password.";return}
 const r=await sb.auth.signInWithPassword({email:e,password:p});
 $("authMsg").textContent=r.error?r.error.message:"Signed in.";
}
async function forgotPassword(){
 const e=$("authEmail").value.trim();
 if(!e){$("authMsg").textContent="Enter your email first.";$("authEmail").focus();return}
 const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
 $("authMsg").textContent=r.error?r.error.message:"Password reset email sent. Check your inbox.";
}
async function signup(){
 const e=$("authEmail").value.trim(),p=$("authPassword").value;
 if(!e||p.length<8){$("authMsg").textContent="Use a valid email and a password of at least 8 characters.";return}
 const r=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});
 $("authMsg").textContent=r.error?r.error.message:(r.data.session?"Account created.":"Account created. Check your email if confirmation is required.");
}

async function loadAll(){
 if(!session)return;
 const uid=session.user.id;
 const [p,c,pm,py,b,r,e]=await Promise.all([
  sb.from("profiles").select("*").eq("id",uid).maybeSingle(),
  sb.from("categories").select("*").eq("user_id",uid).order("name"),
  sb.from("payment_methods").select("*").eq("user_id",uid).order("name"),
  sb.from("payers").select("*").eq("user_id",uid).order("name"),
  sb.from("budgets").select("*").eq("user_id",uid).order("month",{ascending:false}),
  sb.from("recurring_expenses").select("*").eq("user_id",uid).order("next_date"),
  sb.from("expenses").select("*").eq("user_id",uid).order("date",{ascending:false}).order("created_at",{ascending:false})
 ]);
 const bad=[p,c,pm,py,b,r,e].find(x=>x.error);
 if(bad){console.error(bad.error);toast("Cloud load error: "+bad.error.message);return}
 profile=p.data||{id:uid,display_name:session.user.email.split("@")[0],currency:"INR"};
 state.categories=(c.data||[]).map(x=>({id:x.id,name:x.name,icon:x.icon||"•"}));
 state.payments=(pm.data||[]).map(x=>({id:x.id,name:x.name}));
 state.payers=(py.data||[]).map(x=>({id:x.id,name:x.name}));
 state.budgets=b.data||[];state.recurring=r.data||[];
 state.expenses=(e.data||[]).map(x=>({id:x.id,date:x.date,detail:x.detail,type:x.type,amount:Number(x.amount),paidvia:x.paid_via,paidby:x.paid_by,notes:x.notes||""}));
 cache();renderApp();
}

function exportCSV(){const cell=v=>`"${String(v??"").replace(/\r?\n/g," ").replace(/"/g,'""')}"`;const rows=[["Date","Expense Detail","Type of Expense","Amount","Paid via","Paid by","Notes"],...state.expenses.map(x=>[x.date,x.detail,x.type,x.amount,x.paidvia,x.paidby,x.notes])];const csv="\uFEFF"+rows.map(r=>r.map(cell).join(",")).join("\r\n")+"\r\n";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="Pulse_Expenses.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importCSV(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=async ev=>{
  const lines=ev.target.result.split(/\r?\n/).filter(Boolean);
  const parse=line=>{const a=[];let c="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'&&line[i+1]==='"'){c+='"';i++;}else if(ch==='"')q=!q;else if(ch===","&&!q){a.push(c);c="";}else c+=ch;}a.push(c);return a};
  const rows=lines.slice(1).map(parse);
  const data=rows.map(r=>({user_id:session.user.id,date:r[0]?.trim(),detail:r[1]?.trim(),type:r[2]?.trim(),amount:Number(r[3]),paid_via:r[4]?.trim(),paid_by:r[5]?.trim(),notes:r[6]?.trim()||""})).filter(x=>x.date&&x.detail&&Number.isFinite(x.amount));
  if(!data.length){alert("No valid rows found.");return}
  if(!confirm(`Import ${data.length} expenses? Missing categories, payment methods and Paid by options will be added only from this file.`))return;
  const uid=session.user.id;
  const catNames=[...new Set(data.map(x=>x.type).filter(Boolean))];const payNames=[...new Set(data.map(x=>x.paid_via).filter(Boolean))];const payerNames=[...new Set(data.map(x=>x.paid_by).filter(Boolean))];
  const missingCats=catNames.filter(n=>!state.categories.some(x=>x.name===n)).map(name=>({user_id:uid,name,icon:"•"}));
  const missingPays=payNames.filter(n=>!state.payments.some(x=>x.name===n)).map(name=>({user_id:uid,name}));
  const missingPayers=payerNames.filter(n=>!state.payers.some(x=>x.name===n)).map(name=>({user_id:uid,name}));
  if(missingCats.length){const r=await sb.from("categories").insert(missingCats);if(r.error){alert(r.error.message);return}}
  if(missingPays.length){const r=await sb.from("payment_methods").insert(missingPays);if(r.error){alert(r.error.message);return}}
  if(missingPayers.length){const r=await sb.from("payers").insert(missingPayers);if(r.error){alert(r.error.message);return}}
  const r=await sb.from("expenses").insert(data);if(r.error){alert(r.error.message);return}
  await loadAll();toast("Import complete");
 };
 reader.readAsText(file);
}
function renderReports(){
 const el=$("reportMonth"); if(!el)return;
 const months=[...new Set(state.expenses.map(x=>monthKey(x.date)))].sort().reverse();
 const current=el.value||currentMonth();
 el.innerHTML=months.length?months.map(m=>`<option value="${m}">${fmtMonth(m)}</option>`).join(""):`<option value="${currentMonth()}">${fmtMonth(currentMonth())}</option>`;
 if(months.includes(current))el.value=current;else el.value=months[0]||currentMonth();
 const m=el.value;const a=state.expenses.filter(x=>monthKey(x.date)===m);const total=a.reduce((s,x)=>s+Number(x.amount||0),0);
 $("reportTotal").textContent=money(total);$("reportCount").textContent=a.length;$("reportDaily").textContent=money(total/(new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0).getDate()));
 const largest=a.reduce((best,x)=>!best||x.amount>best.amount?x:best,null);$("reportLargest").textContent=money(largest?.amount||0);$("reportLargestName").textContent=largest?.detail||"—";
 const build=(items)=>{const max=Math.max(...items.map(x=>x[1]),1);return items.length?items.map(([name,val])=>`<div class="reportRow"><div class="reportMeta"><div><b>${esc(name)}</b></div><div class="reportBar"><i style="width:${(val/max*100).toFixed(1)}%"></i></div></div><div class="reportAmount">${money(val)}</div></div>`).join(''):'<div class="empty">No data for this month.</div>'};
 const cats=Object.entries(a.reduce((o,x)=>(o[x.type]=(o[x.type]||0)+Number(x.amount||0),o),{})).sort((x,y)=>y[1]-x[1]);
 const pays=Object.entries(a.reduce((o,x)=>(o[x.paidvia]=(o[x.paidvia]||0)+Number(x.amount||0),o),{})).sort((x,y)=>y[1]-x[1]);
 $("reportCats").innerHTML=build(cats);$("reportPays").innerHTML=build(pays);
}

async function deleteMyAccount(){

function getGreetingTime(){
 const hour=new Date().getHours();
 if(hour>=5&&hour<12)return {label:"morning",emoji:"👋"};
 if(hour>=12&&hour<18)return {label:"afternoon",emoji:"☀️"};
 return {label:"evening",emoji:"🌙"};
}

function updateGreeting(){
 const el=$("greeting");
 if(!el||!session)return;
 const greetingName=profile?.display_name||session.user.email.split("@")[0];
 const t=getGreetingTime();
 el.innerHTML=`<span class="greetingHello">Good ${t.label} ${t.emoji}</span><span class="greetingName">${esc(greetingName)}</span>`;
}

function startGreetingClock(){
 updateGreeting();
 clearInterval(window.__pulseGreetingTimer);
 window.__pulseGreetingTimer=setInterval(updateGreeting,60000);
}
